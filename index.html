<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pole Stripper</title>
<style>
html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#0a0a12}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const x=c.getContext('2d');
let W,H,stage=0,tips=0,t=0;

function resize(){
  W=c.width=innerWidth*devicePixelRatio;
  H=c.height=innerHeight*devicePixelRatio;
  c.style.width=innerWidth+'px';
  c.style.height=innerHeight+'px';
  x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.onresize=resize;

const stages=['Bikini','Micro Skirt','Topless'];

function draw(){
  t+=0.016;
  const w=innerWidth,h=innerHeight;
  x.clearRect(0,0,w,h);

  // bg
  x.fillStyle='#0a0a12';x.fillRect(0,0,w,h);
  for(let i=0;i<6;i++){
    x.beginPath();
    x.fillStyle=`hsla(${i*50+t*20},70%,55%,0.12)`;
    x.arc(80+i*60,60+Math.sin(t+i)*30,40,0,7);
    x.fill();
  }

  // floor
  x.fillStyle='#15101f';x.fillRect(0,h*0.78,w,h*0.22);

  // pole
  const px=w*0.5;
  x.fillStyle='#ccc';
  x.fillRect(px-5,h*0.08,10,h*0.7);
  x.fillStyle='#999';x.fillRect(px-7,h*0.08,14,8);

  // dancer
  const ang=t*1.4;
  const radius=38;
  const cx=px+Math.sin(ang)*radius;
  const cy=h*0.42;
  const lean=Math.sin(ang)*18;

  // legs
  x.strokeStyle='#fdb';x.lineWidth=13;x.lineCap='round';
  const legSwing=Math.sin(t*3)*22;
  x.beginPath();
  x.moveTo(cx+lean*0.2,cy+55);
  x.quadraticCurveTo(cx-35+lean,cy+130+legSwing,cx-15+lean*0.5,cy+190);
  x.stroke();
  x.beginPath();
  x.moveTo(cx+lean*0.2,cy+55);
  x.quadraticCurveTo(cx+40+lean,cy+120-legSwing,cx+25+lean*0.4,cy+185);
  x.stroke();

  // high heels
  x.fillStyle='#111';
  x.beginPath();x.moveTo(cx-15+lean*0.5,cy+190);x.lineTo(cx-22,cy+205);x.lineTo(cx-8,cy+205);x.fill();
  x.beginPath();x.moveTo(cx+25+lean*0.4,cy+185);x.lineTo(cx+32,cy+200);x.lineTo(cx+18,cy+200);x.fill();

  // torso
  x.fillStyle='#fdb';
  x.beginPath();
  x.ellipse(cx+lean*0.3,cy+10,26,48,lean*0.015,0,7);
  x.fill();

  // head
  x.beginPath();
  x.ellipse(cx+lean*0.4,cy-55,28,32,0,0,7);
  x.fill();

  // hair
  x.fillStyle='#2a1a10';
  x.beginPath();
  x.ellipse(cx+lean*0.4,cy-70,34,26,0,Math.PI,0);
  x.fill();
  x.beginPath();
  x.moveTo(cx+lean*0.4-28,cy-55);
  x.quadraticCurveTo(cx+lean*0.4-45,cy-10,cx+lean*0.4-20,cy+25);
  x.quadraticCurveTo(cx+lean*0.4-5,cy-5,cx+lean*0.4-18,cy-50);
  x.fill();

  // face
  x.fillStyle='#000';
  x.beginPath();x.arc(cx+lean*0.4-9,cy-60,3,0,7);x.arc(cx+lean*0.4+9,cy-60,3,0,7);x.fill();
  x.strokeStyle='#c66';x.lineWidth=2;
  x.beginPath();x.arc(cx+lean*0.4,cy-48,5,0.15,Math.PI-0.15);x.stroke();

  // arms
  x.strokeStyle='#fdb';x.lineWidth=11;
  x.beginPath();
  x.moveTo(cx+lean*0.2,cy-15);
  x.quadraticCurveTo(cx-25,cy-70,px-4,cy-120);
  x.stroke();
  x.beginPath();
  x.moveTo(cx+lean*0.2,cy-5);
  x.lineTo(px+6,cy-90);
  x.stroke();

  // OUTFITS
  if(stage===0){ // tiny bikini
    // top
    x.fillStyle='#ff1493';
    x.beginPath();x.arc(cx+lean*0.3-15,cy+2,14,0,7);x.arc(cx+lean*0.3+15,cy+2,14,0,7);x.fill();
    // string
    x.strokeStyle='#ff1493';x.lineWidth=2;
    x.beginPath();x.moveTo(cx+lean*0.3-28,cy+2);x.lineTo(cx+lean*0.3+28,cy+2);x.stroke();
    // bottoms
    x.fillStyle='#ff1493';
    x.beginPath();
    x.moveTo(cx+lean*0.3-18,cy+55);
    x.lineTo(cx+lean*0.3+18,cy+55);
    x.lineTo(cx+lean*0.3+12,cy+78);
    x.lineTo(cx+lean*0.3-12,cy+78);
    x.closePath();x.fill();
  }else if(stage===1){ // micro skirt only (top off)
    x.fillStyle='#ff1493';
    x.fillRect(cx+lean*0.3-22,cy+58,44,14);
    // garter lines
    x.strokeStyle='#ff1493';x.lineWidth=2;
    x.beginPath();x.moveTo(cx+lean*0.3-12,cy+72);x.lineTo(cx+lean*0.3-18,cy+110);x.stroke();
    x.beginPath();x.moveTo(cx+lean*0.3+12,cy+72);x.lineTo(cx+lean*0.3+18,cy+110);x.stroke();
  }else{ // topless + pasties optional, just tits
    const b=Math.sin(t*8)*5;
    x.fillStyle='#fdb';
    x.beginPath();x.arc(cx+lean*0.3-16,cy+6+b,18,0,7);x.arc(cx+lean*0.3+16,cy+6-b*0.6,18,0,7);x.fill();
    x.fillStyle='#c44';
    x.beginPath();x.arc(cx+lean*0.3-16,cy+8+b,5,0,7);x.arc(cx+lean*0.3+16,cy+8-b*0.6,5,0,7);x.fill();
  }

  // UI
  x.fillStyle='#fff';x.font='bold 18px system-ui';
  x.fillText('Tips: '+tips,14,28);
  x.fillStyle='#f0a';x.fillText(stages[stage],14,52);
  x.font='15px system-ui';
  x.fillText(stage<2?'Tap to tip':'SHE\'S OUT',14,h-20);

  requestAnimationFrame(draw);
}
draw();

function tip(){
  tips++;
  if(tips>=5&&stage<2){stage++;tips=0;}
}
c.addEventListener('click',tip);
c.addEventListener('touchstart',e=>{e.preventDefault();tip();},{passive:false});
</script>
</body>
</html>
