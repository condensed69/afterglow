<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pole Stripper</title>
<style>
html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;touch-action:none;font-family:system-ui}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:10px;left:10px;color:#fff;text-shadow:0 0 6px #000;font-size:15px;line-height:1.4;pointer-events:none}
#ui b{color:#f0a}
#btns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
button{background:#f0a;border:0;color:#111;padding:6px 12px;border-radius:6px;font-weight:700;font-size:13px}
#hint{position:absolute;bottom:14px;width:100%;text-align:center;color:#f0a;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div id="ui">Tips: <b id="tips">0</b><br>Stage: <b id="stage">Bikini</b><br>Score: <b id="score">0</b><br>Best: <b id="best">0</b><br>Girl: <b id="girl">Amber</b></div>
<div id="btns">
  <button id="girlBtn">Next Girl</button>
  <button id="musicBtn">Music</button>
</div>
<div id="hint">Drag to spin • Tap to tip</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0,stage=0,tips=0,score=0,best=+localStorage.best||0,girl=0;
let spinSpeed=1.3,targetSpeed=1.3,drag=false,lastX=0;
let unlocks={pasties:false,oil:false,invert:false};
const stages=['Bikini','Micro Skirt','Topless'];
const girls=[
  {skin:'#ffddbb',hair:'#3b2314',out:'#ff1493',name:'Amber'},
  {skin:'#e8c4a8',hair:'#1a0a05',out:'#00e5ff',name:'Jade'},
  {skin:'#f5d0c5',hair:'#5c3a1e',out:'#ffe066',name:'Lola'}
];
document.getElementById('best').textContent=best;

function resize(){
  c.width=innerWidth*devicePixelRatio;
  c.height=innerHeight*devicePixelRatio;
  c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();window.onresize=resize;

const AC=window.AudioContext||window.webkitAudioContext;
let actx=null,musicOn=false,bassOsc=null,bassGain=null,musicInterval=null;
function ensureAudio(){if(!actx)actx=new AC();if(actx.state==='suspended')actx.resume();}
function playChaChing(){
  ensureAudio();
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='square';o.frequency.setValueAtTime(1400,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(500,actx.currentTime+0.18);
  g.gain.setValueAtTime(0.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.25);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.3);
}
function playMoan(){
  ensureAudio();
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(300,actx.currentTime);
  o.frequency.linearRampToValueAtTime(150,actx.currentTime+0.4);
  g.gain.setValueAtTime(0.14,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.5);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.55);
}
function startMusic(){
  ensureAudio();if(bassOsc)return;
  bassOsc=actx.createOscillator();bassGain=actx.createGain();
  bassOsc.type='triangle';bassOsc.frequency.value=50;bassGain.gain.value=0;
  bassOsc.connect(bassGain);bassGain.connect(actx.destination);bassOsc.start();
  let beat=0;
  musicInterval=setInterval(()=>{
    if(!musicOn)return;
    beat=(beat+1)%4;const now=actx.currentTime;
    bassGain.gain.cancelScheduledValues(now);
    bassGain.gain.setValueAtTime(0.2,now);bassGain.gain.exponentialRampToValueAtTime(0.015,now+0.25);
    if(beat%2===0){
      const h=actx.createOscillator(),hg=actx.createGain();
      h.type='square';h.frequency.value=9000;
      hg.gain.setValueAtTime(0.035,now);hg.gain.exponentialRampToValueAtTime(0.001,now+0.04);
      h.connect(hg);hg.connect(actx.destination);h.start(now);h.stop(now+0.05);
    }
  },300);
}
function stopMusic(){
  if(musicInterval){clearInterval(musicInterval);musicInterval=null;}
  if(bassOsc){try{bassOsc.stop();}catch(e){}bassOsc=null;bassGain=null;}
}
function toggleMusic(){
  ensureAudio();musicOn=!musicOn;
  document.getElementById('musicBtn').textContent=musicOn?'Mute':'Music';
  if(musicOn)startMusic();else stopMusic();
}
document.getElementById('musicBtn').onclick=toggleMusic;
document.getElementById('girlBtn').onclick=()=>{girl=(girl+1)%girls.length;document.getElementById('girl').textContent=girls[girl].name;};

c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(!drag)return;targetSpeed=Math.max(0.5,Math.min(4.2,targetSpeed+(e.clientX-lastX)*0.03));lastX=e.clientX;});
c.addEventListener('pointerup',()=>drag=false);
c.addEventListener('pointercancel',()=>drag=false);

function tip(){
  tips++;score+=10+stage*8;
  document.getElementById('tips').textContent=tips;document.getElementById('score').textContent=score;
  playChaChing();
  if(score>best){best=score;localStorage.best=best;document.getElementById('best').textContent=best;}
  if(tips>=5&&stage<2){
    stage++;tips=0;document.getElementById('tips').textContent=0;document.getElementById('stage').textContent=stages[stage];
    playMoan();if(stage===2){unlocks.pasties=true;unlocks.oil=true;}
  }
  if(score>=80)unlocks.invert=true;
}
c.addEventListener('click',e=>{if(!drag)tip();});

function draw(){
  t+=0.016;
  spinSpeed+=(targetSpeed-spinSpeed)*0.1;
  const w=innerWidth,h=innerHeight,G=girls[girl];
  x.clearRect(0,0,w,h);
  x.fillStyle='#0a0a12';x.fillRect(0,0,w,h);

  // soft lights
  for(let i=0;i<6;i++){
    x.beginPath();
    x.fillStyle=`hsla(${i*50+t*20},70%,50%,0.13)`;
    x.arc(60+i*60,50+Math.sin(t+i)*25,38,0,7);x.fill();
  }
  x.fillStyle='#120c1c';x.fillRect(0,h*0.82,w,h*0.18);

  // pole
  const px=w/2;
  x.fillStyle='#d0d0d0';x.fillRect(px-4,h*0.06,8,h*0.76);
  x.fillStyle='#999';x.fillRect(px-6,h*0.06,12,7);

  const dir=(unlocks.invert&&stage===2)?-1:1;
  const ang=t*spinSpeed*dir;
  const r=36;
  const cx=px+Math.sin(ang)*r;
  const cy=h*0.38;
  const lean=Math.sin(ang)*16;

  // ===== CLEAN BODY =====
  x.fillStyle=G.skin;
  x.strokeStyle=G.skin;
  x.lineCap='round';x.lineJoin='round';

  // back arm (behind pole)
  x.lineWidth=11;
  x.beginPath();
  x.moveTo(cx-8+lean*0.3,cy-25);
  x.quadraticCurveTo(cx-28,cy-70,px-5,cy-115);
  x.stroke();

  // legs - solid thick strokes + fill for thighs
  x.lineWidth=16;
  const swing=Math.sin(t*3)*18;
  // left leg
  x.beginPath();
  x.moveTo(cx-6+lean*0.2,cy+45);
  x.quadraticCurveTo(cx-30+lean,cy+110+swing,cx-14+lean*0.3,cy+185);
  x.stroke();
  // right leg
  x.beginPath();
  x.moveTo(cx+6+lean*0.2,cy+45);
  x.quadraticCurveTo(cx+32+lean,cy+105-swing,cx+18+lean*0.2,cy+182);
  x.stroke();

  // heels
  x.fillStyle='#111';
  x.beginPath();x.moveTo(cx-18+lean*0.3,cy+183);x.lineTo(cx-26,cy+198);x.lineTo(cx-8,cy+198);x.fill();
  x.beginPath();x.moveTo(cx+14+lean*0.2,cy+180);x.lineTo(cx+24,cy+195);x.lineTo(cx+6,cy+195);x.fill();

  // hips / lower torso
  x.fillStyle=G.skin;
  x.beginPath();
  x.ellipse(cx+lean*0.15,cy+40,30,20,0,0,7);
  x.fill();

  // upper torso
  x.beginPath();
  x.moveTo(cx-20+lean*0.25,cy+30);
  x.quadraticCurveTo(cx-14+lean*0.3,cy-5,cx-16+lean*0.35,cy-40);
  x.lineTo(cx+16+lean*0.35,cy-40);
  x.quadraticCurveTo(cx+14+lean*0.3,cy-5,cx+20+lean*0.25,cy+30);
  x.closePath();
  x.fill();

  // breasts
  const b=Math.sin(t*7)*3.5;
  x.beginPath();x.ellipse(cx+lean*0.3-15,cy-22+b,16,17,-0.12,0,7);x.fill();
  x.beginPath();x.ellipse(cx+lean*0.3+15,cy-22-b*0.7,16,17,0.12,0,7);x.fill();

  // neck
  x.beginPath();x.ellipse(cx+lean*0.4,cy-52,9,12,0,0,7);x.fill();

  // head
  x.beginPath();x.ellipse(cx+lean*0.42,cy-82,24,27,0,0,7);x.fill();

  // hair
  x.fillStyle=G.hair;
  x.beginPath();x.ellipse(cx+lean*0.42,cy-98,30,24,0,Math.PI,0);x.fill();
  // side hair
  x.beginPath();
  x.moveTo(cx+lean*0.42-26,cy-85);
  x.quadraticCurveTo(cx+lean*0.42-40,cy-30,cx+lean*0.42-18,cy+5);
  x.quadraticCurveTo(cx+lean*0.42-6,cy-25,cx+lean*0.42-16,cy-80);
  x.fill();
  x.beginPath();
  x.moveTo(cx+lean*0.42+24,cy-85);
  x.quadraticCurveTo(cx+lean*0.42+38,cy-40,cx+lean*0.42+16,cy-5);
  x.quadraticCurveTo(cx+lean*0.42+8,cy-30,cx+lean*0.42+14,cy-80);
  x.fill();

  // face
  x.fillStyle='#222';
  x.beginPath();x.arc(cx+lean*0.42-8,cy-86,2.8,0,7);x.arc(cx+lean*0.42+8,cy-86,2.8,0,7);x.fill();
  x.strokeStyle='#c66';x.lineWidth=1.8;
  x.beginPath();x.arc(cx+lean*0.42,cy-74,4.5,0.3,Math.PI-0.3);x.stroke();

  // front arm
  x.strokeStyle=G.skin;x.lineWidth=11;
  x.beginPath();
  x.moveTo(cx+8+lean*0.3,cy-20);
  x.quadraticCurveTo(cx+22,cy-55,px+6,cy-95);
  x.stroke();

  // ===== OUTFIT =====
  if(stage===0){
    // bikini top
    x.fillStyle=G.out;
    x.beginPath();x.ellipse(cx+lean*0.3-14,cy-22,14,12,-0.1,0,7);x.fill();
    x.beginPath();x.ellipse(cx+lean*0.3+14,cy-22,14,12,0.1,0,7);x.fill();
    x.strokeStyle=G.out;x.lineWidth=2.2;
    x.beginPath();x.moveTo(cx+lean*0.3-28,cy-22);x.lineTo(cx+lean*0.3+28,cy-22);x.stroke();
    // bottoms
    x.beginPath();
    x.moveTo(cx-18+lean*0.15,cy+32);
    x.quadraticCurveTo(cx,cy+48,cx+18+lean*0.15,cy+32);
    x.quadraticCurveTo(cx+12,cy+62,cx+7,cy+68);
    x.lineTo(cx-7,cy+68);
    x.quadraticCurveTo(cx-12,cy+62,cx-18+lean*0.15,cy+32);
    x.fill();
  }else if(stage===1){
    x.fillStyle=G.out;
    x.beginPath();
    x.moveTo(cx-22+lean*0.15,cy+30);
    x.lineTo(cx+22+lean*0.15,cy+30);
    x.quadraticCurveTo(cx+18,cy+55,cx+12,cy+60);
    x.lineTo(cx-12,cy+60);
    x.quadraticCurveTo(cx-18,cy+55,cx-22+lean*0.15,cy+30);
    x.fill();
    x.strokeStyle=G.out;x.lineWidth=2;
    x.beginPath();x.moveTo(cx-10,cy+60);x.lineTo(cx-16,cy+110);x.stroke();
    x.beginPath();x.moveTo(cx+10,cy+60);x.lineTo(cx+16,cy+110);x.stroke();
  }else{
    if(unlocks.pasties){
      x.fillStyle=G.out;
      x.beginPath();x.arc(cx+lean*0.3-15,cy-20+b,6.5,0,7);x.arc(cx+lean*0.3+15,cy-20-b*0.7,6.5,0,7);x.fill();
    }else{
      x.fillStyle='#c44';
      x.beginPath();x.arc(cx+lean*0.3-15,cy-20+b,4.5,0,7);x.arc(cx+lean*0.3+15,cy-20-b*0.7,4.5,0,7);x.fill();
    }
    if(unlocks.oil){
      x.fillStyle='rgba(255,255,255,0.25)';
      x.beginPath();x.ellipse(cx+lean*0.3-9,cy-38,6,14,0.25,0,7);x.fill();
    }
  }

  if(unlocks.invert&&stage===2){
    x.fillStyle='#0f0';x.font='12px system-ui';x.fillText('INVERT',14,h-36);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
