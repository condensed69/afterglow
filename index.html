<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pole Stripper Pro</title>
<style>
html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;touch-action:none;font-family:system-ui}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:10px;left:10px;color:#fff;text-shadow:0 0 6px #000;font-size:15px;line-height:1.45;pointer-events:none}
#ui b{color:#f0a}
#btns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
button{background:#f0a;border:0;color:#111;padding:6px 10px;border-radius:6px;font-weight:700;font-size:13px}
#hint{position:absolute;bottom:12px;width:100%;text-align:center;color:#f0a;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div id="ui">Tips: <b id="tips">0</b><br>Stage: <b id="stage">Bikini</b><br>Score: <b id="score">0</b><br>Best: <b id="best">0</b><br>Girl: <b id="girl">Amber</b></div>
<div id="btns">
  <button id="girlBtn">Next Girl</button>
  <button id="musicBtn">Music</button>
</div>
<div id="hint">Drag to spin • Tap to tip</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0,stage=0,tips=0,score=0,best=+localStorage.best||0,girl=0;
let spinSpeed=1.2,targetSpeed=1.2,drag=false,lastX=0;
let unlocks={pasties:false,oil:false,invert:false};
const stages=['Bikini','Micro Skirt','Topless'];
const girls=[
  {skin:'#fdb',hair:'#2a1a10',out:'#ff1493',name:'Amber'},
  {skin:'#e8c4a8',hair:'#1a0a05',out:'#00e5ff',name:'Jade'},
  {skin:'#f5d0c5',hair:'#4a2c0a',out:'#ffe066',name:'Lola'}
];
document.getElementById('best').textContent=best;

function resize(){
  c.width=innerWidth*devicePixelRatio;
  c.height=innerHeight*devicePixelRatio;
  c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();window.onresize=resize;

// ===== AUDIO =====
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null, musicOn=false, bassOsc=null, bassGain=null, hatOsc=null, musicInterval=null;

function ensureAudio(){
  if(!actx){
    actx=new AC();
  }
  if(actx.state==='suspended') actx.resume();
}

function playChaChing(){
  ensureAudio();
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(1400,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(500,actx.currentTime+0.18);
  g.gain.setValueAtTime(0.2,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.25);
  o.connect(g);g.connect(actx.destination);
  o.start();o.stop(actx.currentTime+0.3);
}

function playMoan(){
  ensureAudio();
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(320,actx.currentTime);
  o.frequency.linearRampToValueAtTime(160,actx.currentTime+0.45);
  g.gain.setValueAtTime(0.15,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.55);
  o.connect(g);g.connect(actx.destination);
  o.start();o.stop(actx.currentTime+0.6);
}

function startMusic(){
  ensureAudio();
  if(bassOsc) return;

  // continuous low bass
  bassOsc = actx.createOscillator();
  bassGain = actx.createGain();
  bassOsc.type = 'triangle';
  bassOsc.frequency.value = 48;
  bassGain.gain.value = 0.0;
  bassOsc.connect(bassGain);
  bassGain.connect(actx.destination);
  bassOsc.start();

  // pulse the gain for beat
  let beat = 0;
  musicInterval = setInterval(()=>{
    if(!musicOn) return;
    beat = (beat+1)%4;
    const now = actx.currentTime;
    bassGain.gain.cancelScheduledValues(now);
    bassGain.gain.setValueAtTime(0.22, now);
    bassGain.gain.exponentialRampToValueAtTime(0.02, now+0.28);

    // hi-hat click every other beat
    if(beat%2===0){
      const h=actx.createOscillator(), hg=actx.createGain();
      h.type='square'; h.frequency.value=8000;
      hg.gain.setValueAtTime(0.04,now);
      hg.gain.exponentialRampToValueAtTime(0.001,now+0.05);
      h.connect(hg);hg.connect(actx.destination);
      h.start(now);h.stop(now+0.06);
    }
  }, 280);
}

function stopMusic(){
  if(musicInterval){clearInterval(musicInterval);musicInterval=null;}
  if(bassOsc){
    try{bassOsc.stop();}catch(e){}
    bassOsc=null;bassGain=null;
  }
}

function toggleMusic(){
  ensureAudio();
  musicOn = !musicOn;
  document.getElementById('musicBtn').textContent = musicOn ? 'Mute' : 'Music';
  if(musicOn) startMusic();
  else stopMusic();
}
document.getElementById('musicBtn').onclick = toggleMusic;

// Girl
document.getElementById('girlBtn').onclick=()=>{
  girl=(girl+1)%girls.length;
  document.getElementById('girl').textContent=girls[girl].name;
};

// Drag
c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{
  if(!drag)return;
  targetSpeed = Math.max(0.4, Math.min(4.5, targetSpeed + (e.clientX-lastX)*0.025));
  lastX=e.clientX;
});
c.addEventListener('pointerup',()=>drag=false);
c.addEventListener('pointercancel',()=>drag=false);

function tip(){
  tips++; score += 10 + stage*8;
  document.getElementById('tips').textContent=tips;
  document.getElementById('score').textContent=score;
  playChaChing();
  if(score>best){best=score;localStorage.best=best;document.getElementById('best').textContent=best;}
  if(tips>=5 && stage<2){
    stage++; tips=0;
    document.getElementById('tips').textContent=0;
    document.getElementById('stage').textContent=stages[stage];
    playMoan();
    if(stage===2){unlocks.pasties=true;unlocks.oil=true;}
  }
  if(score>=80) unlocks.invert=true;
}
c.addEventListener('click',e=>{if(!drag) tip();});

function draw(){
  t+=0.016;
  spinSpeed += (targetSpeed - spinSpeed)*0.1;
  const w=innerWidth, h=innerHeight, G=girls[girl];
  x.clearRect(0,0,w,h);
  x.fillStyle='#0a0a12'; x.fillRect(0,0,w,h);

  for(let i=0;i<7;i++){
    x.beginPath();
    x.fillStyle=`hsla(${i*45+t*25},75%,55%,0.14)`;
    x.arc(70+i*55,55+Math.sin(t+i)*30,42,0,7); x.fill();
  }
  x.fillStyle='#15101f'; x.fillRect(0,h*0.78,w,h*0.22);

  const px = w*0.5;
  x.fillStyle='#ccc'; x.fillRect(px-5,h*0.07,10,h*0.72);
  x.fillStyle='#888'; x.fillRect(px-7,h*0.07,14,8);

  const dir = (unlocks.invert && stage===2) ? -1 : 1;
  const ang = t * spinSpeed * dir;
  const radius=40;
  const cx = px + Math.sin(ang)*radius;
  const cy = h*0.41;
  const lean = Math.sin(ang)*20;

  // legs
  x.strokeStyle=G.skin; x.lineWidth=13; x.lineCap='round';
  const leg1=Math.sin(t*3.3)*28, leg2=Math.sin(t*3.3+1.2)*25;
  x.beginPath(); x.moveTo(cx+lean*0.2,cy+55);
  x.quadraticCurveTo(cx-38+lean,cy+135+leg1,cx-12+lean*0.4,cy+195); x.stroke();
  x.beginPath(); x.moveTo(cx+lean*0.2,cy+55);
  x.quadraticCurveTo(cx+42+lean,cy+125-leg2,cx+28+lean*0.3,cy+188); x.stroke();

  // heels
  x.fillStyle='#111';
  x.fillRect(cx-20+lean*0.4,cy+193,16,12);
  x.fillRect(cx+20+lean*0.3,cy+186,16,12);

  // torso
  x.fillStyle=G.skin;
  x.beginPath(); x.ellipse(cx+lean*0.3,cy+8,27,50,lean*0.02,0,7); x.fill();

  // head
  x.beginPath(); x.ellipse(cx+lean*0.4,cy-58,29,33,0,0,7); x.fill();
  x.fillStyle=G.hair;
  x.beginPath(); x.ellipse(cx+lean*0.4,cy-74,36,28,0,Math.PI,0); x.fill();
  x.beginPath(); x.moveTo(cx+lean*0.4-30,cy-58);
  x.quadraticCurveTo(cx+lean*0.4-48,cy-5,cx+lean*0.4-18,cy+30);
  x.quadraticCurveTo(cx+lean*0.4,cy,cx+lean*0.4-20,cy-55); x.fill();

  // face
  x.fillStyle='#000';
  x.beginPath(); x.arc(cx+lean*0.4-10,cy-63,3.2,0,7); x.arc(cx+lean*0.4+10,cy-63,3.2,0,7); x.fill();
  x.strokeStyle='#c66'; x.lineWidth=2.2;
  x.beginPath(); x.arc(cx+lean*0.4,cy-50,5.5,0.2,Math.PI-0.2); x.stroke();

  // arms
  x.strokeStyle=G.skin; x.lineWidth=11;
  x.beginPath(); x.moveTo(cx+lean*0.2,cy-18);
  x.quadraticCurveTo(cx-30,cy-75,px-5,cy-125); x.stroke();
  x.beginPath(); x.moveTo(cx+lean*0.2,cy-8); x.lineTo(px+8,cy-95); x.stroke();

  // outfits
  if(stage===0){
    x.fillStyle=G.out;
    x.beginPath(); x.arc(cx+lean*0.3-16,cy,15,0,7); x.arc(cx+lean*0.3+16,cy,15,0,7); x.fill();
    x.strokeStyle=G.out; x.lineWidth=2.5;
    x.beginPath(); x.moveTo(cx+lean*0.3-30,cy); x.lineTo(cx+lean*0.3+30,cy); x.stroke();
    x.beginPath();
    x.moveTo(cx+lean*0.3-20,cy+55); x.lineTo(cx+lean*0.3+20,cy+55);
    x.lineTo(cx+lean*0.3+13,cy+80); x.lineTo(cx+lean*0.3-13,cy+80); x.closePath(); x.fill();
  }else if(stage===1){
    x.fillStyle=G.out;
    x.fillRect(cx+lean*0.3-24,cy+58,48,15);
    x.strokeStyle=G.out; x.lineWidth=2;
    x.beginPath(); x.moveTo(cx+lean*0.3-14,cy+73); x.lineTo(cx+lean*0.3-20,cy+115); x.stroke();
    x.beginPath(); x.moveTo(cx+lean*0.3+14,cy+73); x.lineTo(cx+lean*0.3+20,cy+115); x.stroke();
  }else{
    const b=Math.sin(t*9)*6;
    x.fillStyle=G.skin;
    x.beginPath(); x.arc(cx+lean*0.3-17,cy+5+b,19,0,7); x.arc(cx+lean*0.3+17,cy+5-b*0.65,19,0,7); x.fill();
    if(unlocks.pasties){
      x.fillStyle=G.out;
      x.beginPath(); x.arc(cx+lean*0.3-17,cy+7+b,6,0,7); x.arc(cx+lean*0.3+17,cy+7-b*0.65,6,0,7); x.fill();
    }else{
      x.fillStyle='#c44';
      x.beginPath(); x.arc(cx+lean*0.3-17,cy+7+b,5.5,0,7); x.arc(cx+lean*0.3+17,cy+7-b*0.65,5.5,0,7); x.fill();
    }
    if(unlocks.oil){
      x.fillStyle='rgba(255,255,255,0.28)';
      x.beginPath(); x.ellipse(cx+lean*0.3-12,cy-5,8,18,0.3,0,7); x.fill();
    }
  }

  if(unlocks.invert && stage===2){
    x.fillStyle='#0f0'; x.font='12px system-ui'; x.fillText('INVERT ON',14,h-38);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
