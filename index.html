<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Strip Club Idle</title>
<style>
html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;touch-action:none;font-family:system-ui;color:#fff}
canvas{display:block;width:100%;height:70%}
#ui{position:absolute;top:6px;left:8px;text-shadow:0 0 5px #000;font-size:13px;line-height:1.3;pointer-events:none;z-index:5}
#ui b{color:#f0a}
#panel{position:absolute;bottom:0;left:0;right:0;background:rgba(8,4,16,0.95);padding:8px;z-index:10;max-height:32%;overflow-y:auto;font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
button{background:#f0a;border:0;color:#111;padding:7px 8px;border-radius:5px;font-weight:700;font-size:11px;flex:1;min-width:100px}
button:disabled{opacity:0.3}
</style>
</head>
<body>
<div id="ui">
$ <b id="money">0</b> &nbsp; Tips <b id="tipsRes">0</b><br>
Hype <b id="hype">0</b> &nbsp; Attention <b id="attn">0</b><br>
Stage: <b id="stage">Bikini</b> &nbsp; Girl: <b id="girl">Amber</b>
</div>
<div id="panel">
  <div class="row">
    <button id="bTipJar">Tip Jar ($25)</button>
    <button id="bVip">VIP Room ($120)</button>
  </div>
  <div class="row">
    <button id="bDj">DJ Booth ($80)</button>
    <button id="bAds">Flyer Ads ($60)</button>
  </div>
  <div class="row">
    <button id="bGirl">Hire Girl ($250)</button>
    <button id="bStage">Next Outfit ($180)</button>
  </div>
  <div class="row">
    <button id="musicBtn">Music</button>
  </div>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0,stage=0,girl=0,drag=false,lastX=0,spinSpeed=1.2,targetSpeed=1.2;
let money=0,tipsRes=0,hype=0,attn=0;
let tipJar=0,vip=0,dj=0,ads=0;
let unlocks={pasties:false,oil:false};
const stages=['Bikini','Micro Skirt','Topless'];
const girls=[
  {skin:'#ffddbb',hair:'#3b2314',out:'#ff1493',name:'Amber'},
  {skin:'#e8c4a8',hair:'#1a0a05',out:'#00e5ff',name:'Jade'},
  {skin:'#f5d0c5',hair:'#5c3a1e',out:'#ffe066',name:'Lola'}
];
let pTip=25,pVip=120,pDj=80,pAds=60,pGirl=250,pStage=180;

function resize(){
  c.width=innerWidth*devicePixelRatio;
  c.height=innerHeight*0.7*devicePixelRatio;
  c.style.width=innerWidth+'px';c.style.height=(innerHeight*0.7)+'px';
  x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();window.onresize=resize;

const AC=window.AudioContext||window.webkitAudioContext;
let actx=null,musicOn=false,bassOsc=null,bassGain=null,musicInterval=null;
function ensureAudio(){if(!actx)actx=new AC();if(actx.state==='suspended')actx.resume();}
function playChaChing(){
  ensureAudio();
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='square';o.frequency.setValueAtTime(1300,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(400,actx.currentTime+0.15);
  g.gain.setValueAtTime(0.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.2);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.25);
}
function startMusic(){
  ensureAudio();if(bassOsc)return;
  bassOsc=actx.createOscillator();bassGain=actx.createGain();
  bassOsc.type='triangle';bassOsc.frequency.value=48;bassGain.gain.value=0;
  bassOsc.connect(bassGain);bassGain.connect(actx.destination);bassOsc.start();
  let beat=0;
  musicInterval=setInterval(()=>{
    if(!musicOn)return;
    beat=(beat+1)%4;const now=actx.currentTime;
    bassGain.gain.cancelScheduledValues(now);
    bassGain.gain.setValueAtTime(0.16,now);bassGain.gain.exponentialRampToValueAtTime(0.01,now+0.22);
  },320);
}
function stopMusic(){if(musicInterval)clearInterval(musicInterval);if(bassOsc){try{bassOsc.stop()}catch(e){}bassOsc=null;}}
document.getElementById('musicBtn').onclick=()=>{ensureAudio();musicOn=!musicOn;document.getElementById('musicBtn').textContent=musicOn?'Mute':'Music';musicOn?startMusic():stopMusic();};

function ui(){
  document.getElementById('money').textContent=Math.floor(money);
  document.getElementById('tipsRes').textContent=Math.floor(tipsRes);
  document.getElementById('hype').textContent=Math.floor(hype);
  document.getElementById('attn').textContent=Math.floor(attn);
  document.getElementById('stage').textContent=stages[stage];
  document.getElementById('girl').textContent=girls[girl].name;
}

document.getElementById('bTipJar').onclick=()=>{if(money<pTip)return;money-=pTip;tipJar++;pTip=Math.floor(pTip*1.65);document.getElementById('bTipJar').textContent=`Tip Jar x${tipJar} ($${pTip})`;ui();};
document.getElementById('bVip').onclick=()=>{if(money<pVip)return;money-=pVip;vip++;pVip=Math.floor(pVip*1.8);document.getElementById('bVip').textContent=`VIP x${vip} ($${pVip})`;ui();};
document.getElementById('bDj').onclick=()=>{if(money<pDj)return;money-=pDj;dj++;pDj=Math.floor(pDj*1.7);document.getElementById('bDj').textContent=`DJ x${dj} ($${pDj})`;ui();};
document.getElementById('bAds').onclick=()=>{if(money<pAds)return;money-=pAds;ads++;pAds=Math.floor(pAds*1.6);document.getElementById('bAds').textContent=`Ads x${ads} ($${pAds})`;ui();};
document.getElementById('bGirl').onclick=()=>{if(money<pGirl||girl>=2)return;money-=pGirl;girl++;pGirl=Math.floor(pGirl*2.2);document.getElementById('bGirl').textContent=girl>=2?'All Girls':`Hire Girl ($${pGirl})`;if(girl>=2)document.getElementById('bGirl').disabled=true;ui();};
document.getElementById('bStage').onclick=()=>{if(money<pStage||stage>=2)return;money-=pStage;stage++;pStage=Math.floor(pStage*2);document.getElementById('bStage').textContent=stage>=2?'Max Stage':`Next Outfit ($${pStage})`;if(stage===2){unlocks.pasties=true;unlocks.oil=true;document.getElementById('bStage').disabled=true;}ui();};

c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(!drag)return;targetSpeed=Math.max(0.6,Math.min(4.5,targetSpeed+(e.clientX-lastX)*0.03));lastX=e.clientX;});
c.addEventListener('pointerup',()=>drag=false);

function manualTip(){
  tipsRes+=1+tipJar*0.5;
  money+=5+vip*3;
  playChaChing();
  ui();
}
c.addEventListener('click',e=>{if(!drag)manualTip();});

// production tick (Kittens style)
setInterval(()=>{
  // Tip Jar turns attention into tips
  tipsRes += (0.05 + tipJar*0.08) * (1+attn*0.01);
  // VIP turns tips into money
  money += (0.1 + vip*0.25) * (1+tipsRes*0.002);
  // DJ generates hype
  hype += 0.03 + dj*0.12;
  // Ads generate attention from hype
  attn += (0.02 + ads*0.07) * (1+hype*0.005);
  // soft caps / conversion pressure
  if(tipsRes>200) money += tipsRes*0.001;
  ui();
},150);

function draw(){
  t+=0.016;spinSpeed+=(targetSpeed-spinSpeed)*0.1;
  const w=innerWidth,h=c.height/devicePixelRatio,G=girls[girl];
  x.clearRect(0,0,w,h);
  x.fillStyle='#0a0a12';x.fillRect(0,0,w,h);
  for(let i=0;i<5;i++){x.beginPath();x.fillStyle=`hsla(${i*55+t*18},70%,50%,0.11)`;x.arc(50+i*70,40+Math.sin(t+i)*20,32,0,7);x.fill();}
  x.fillStyle='#120c1c';x.fillRect(0,h*0.82,w,h*0.18);
  const px=w/2;
  x.fillStyle='#ccc';x.fillRect(px-4,h*0.04,8,h*0.78);
  const ang=t*spinSpeed,r=32,cx=px+Math.sin(ang)*r,cy=h*0.38,lean=Math.sin(ang)*12;
  x.fillStyle=G.skin;
  const sw=Math.sin(t*2.6)*12;
  x.beginPath();x.moveTo(cx-7,cy+35);x.quadraticCurveTo(cx-32+lean,cy+90+sw,cx-18,cy+160);x.quadraticCurveTo(cx-12,cy+185,cx-8,cy+190);x.lineTo(cx-1,cy+190);x.quadraticCurveTo(cx-3,cy+130,cx-2,cy+45);x.closePath();x.fill();
  x.beginPath();x.moveTo(cx+7,cy+35);x.quadraticCurveTo(cx+32+lean,cy+85-sw,cx+20,cy+158);x.quadraticCurveTo(cx+14,cy+182,cx+10,cy+188);x.lineTo(cx+3,cy+188);x.quadraticCurveTo(cx+5,cy+125,cx+3,cy+45);x.closePath();x.fill();
  x.fillStyle='#1a1a1a';x.beginPath();x.moveTo(cx-14,cy+188);x.lineTo(cx-22,cy+200);x.lineTo(cx-5,cy+200);x.fill();
  x.beginPath();x.moveTo(cx+12,cy+186);x.lineTo(cx+22,cy+198);x.lineTo(cx+5,cy+198);x.fill();
  x.fillStyle=G.skin;
  x.beginPath();x.ellipse(cx,cy+32,28,16,0,0,7);x.fill();
  x.beginPath();x.moveTo(cx-20,cy+25);x.quadraticCurveTo(cx-13,cy-5,cx-15,cy-30);x.quadraticCurveTo(cx-16,cy-48,cx-10,cy-52);x.lineTo(cx+10,cy-52);x.quadraticCurveTo(cx+16,cy-48,cx+15,cy-30);x.quadraticCurveTo(cx+13,cy-5,cx+20,cy+25);x.closePath();x.fill();
  const b=Math.sin(t*7)*3.5;
  x.beginPath();x.ellipse(cx-14,cy-26+b,15,17,-0.15,0,7);x.fill();
  x.beginPath();x.ellipse(cx+14,cy-26-b*0.6,15,17,0.15,0,7);x.fill();
  x.beginPath();x.ellipse(cx,cy-58,9,11,0,0,7);x.fill();
  x.beginPath();x.ellipse(cx,cy-86,22,26,0,0,7);x.fill();
  x.fillStyle=G.hair;
  x.beginPath();x.ellipse(cx,cy-100,28,22,0,Math.PI,0);x.fill();
  x.beginPath();x.moveTo(cx-24,cy-88);x.quadraticCurveTo(cx-38,cy-30,cx-16,cy+5);x.quadraticCurveTo(cx-4,cy-15,cx-12,cy-80);x.fill();
  x.fillStyle='#222';x.beginPath();x.arc(cx-8,cy-90,2.6,0,7);x.arc(cx+8,cy-90,2.6,0,7);x.fill();
  x.strokeStyle='#c66';x.lineWidth=1.8;x.beginPath();x.arc(cx,cy-78,4.2,0.3,Math.PI-0.3);x.stroke();
  x.strokeStyle=G.skin;x.lineWidth=11;x.lineCap='round';
  x.beginPath();x.moveTo(cx-8,cy-28);x.quadraticCurveTo(cx-28,cy-70,px-4,cy-115);x.stroke();
  x.beginPath();x.moveTo(cx+8,cy-22);x.quadraticCurveTo(cx+22,cy-55,px+6,cy-95);x.stroke();
  if(stage===0){
    x.fillStyle=G.out;
    x.beginPath();x.ellipse(cx-13,cy-26,13,11,-0.12,0,7);x.fill();
    x.beginPath();x.ellipse(cx+13,cy-26,13,11,0.12,0,7);x.fill();
    x.beginPath();x.moveTo(cx-18,cy+24);x.quadraticCurveTo(cx,cy+40,cx+18,cy+24);x.quadraticCurveTo(cx+12,cy+58,cx+6,cy+64);x.lineTo(cx-6,cy+64);x.quadraticCurveTo(cx-12,cy+58,cx-18,cy+24);x.fill();
  }else if(stage===1){
    x.fillStyle=G.out;
    x.beginPath();x.moveTo(cx-20,cy+22);x.lineTo(cx+20,cy+22);x.quadraticCurveTo(cx+16,cy+48,cx+10,cy+54);x.lineTo(cx-10,cy+54);x.quadraticCurveTo(cx-16,cy+48,cx-20,cy+22);x.fill();
  }else{
    if(unlocks.pasties){x.fillStyle=G.out;x.beginPath();x.arc(cx-14,cy-24+b,6,0,7);x.arc(cx+14,cy-24-b*0.6,6,0,7);x.fill();}
    else{x.fillStyle='#c44';x.beginPath();x.arc(cx-14,cy-24+b,4.2,0,7);x.arc(cx+14,cy-24-b*0.6,4.2,0,7);x.fill();}
  }
  requestAnimationFrame(draw);
}
draw();ui();
</script>
</body>
</html>
