initialize:
  - run: |
      # No setup needed - this is a dependency-free static site
      echo "Afterglow Club Idle - dependency-free static site"

maintenance:
  - run: |
      # Clone the repo on session start
      if [ ! -d "stripper-dance" ]; then
        git clone https://github.com/condensed69/stripper-dance.git
      else
        cd stripper-dance && git pull
      fi

knowledge:
  - name: lint
    contents: |
      # Validate JavaScript syntax
      cd stripper-dance && node --check game.js

  - name: test
    contents: |
      # Run economy simulation tests
      cd stripper-dance && node economy.test.mjs

  - name: startup
    contents: |
      # This is a static site - open index.html in a browser
      # No server needed - just open the file directly
      echo "Open stripper-dance/index.html in a browser to run the game"
      # Or use a simple HTTP server for development:
      # cd stripper-dance && python3 -m http.server 8000
