name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      !github.event.comment.user.bot &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity & auth
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Run OpenCode (Primary - Qwen 3.7 Plus)
        id: opencode-primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          # models.dev registers opencode-go under OPENCODE_API_KEY (not OPENCODE_GO_API_KEY)
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/qwen3.7-plus
          use_github_token: true
          share: false

      - name: Run OpenCode (Free Fallback - GLM 5.2)
        if: steps.opencode-primary.outcome != 'success'
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # OpenRouter's `free` router alias is not an executable model in
          # OpenCode's catalog. Pin a currently catalogued :free model so the
          # fallback can actually run when OpenCode Go is unavailable.
          model: openrouter/z-ai/glm-5.2:free
          use_github_token: true
          share: false
