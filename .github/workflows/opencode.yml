name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      !github.event.comment.user.bot &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity & auth
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # Install OpenCode directly instead of via the anomalyco/opencode action.
      # That action's "Get opencode version" step does an UNAUTHENTICATED curl to
      # api.github.com/repos/anomalyco/opencode/releases/latest, which trips the
      # 60/hr/IP rate limit on shared runner IPs and fails the whole step
      # (`curl -f` exits 1) before any model runs. Inlining removes that call.
      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run OpenCode (Primary - Qwen 3.7 Plus)
        id: opencode-primary
        run: opencode github run
        continue-on-error: true
        timeout-minutes: 15
        env:
          MODEL: opencode-go/qwen3.7-plus
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
          MENTIONS: "/opencode,/oc"
          # models.dev registers opencode-go under OPENCODE_API_KEY (not OPENCODE_GO_API_KEY)
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OpenCode (Free Fallback - Laguna S 2.1)
        if: steps.opencode-primary.outcome != 'success'
        run: opencode github run
        timeout-minutes: 15
        env:
          MODEL: openrouter/poolside/laguna-s-2.1:free
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
          MENTIONS: "/opencode,/oc"
          # Pin a catalogued :free code model that is verified through this
          # repository's current OpenRouter credential. The prior GLM fallback
          # was intermittently rate-limited upstream.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
